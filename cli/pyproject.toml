[project]
name = "opentraces"
version = "0.1.0"
description = "OpenTraces CLI — sell your coding agent's traces (ot login, ot push)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = [
    "typer>=0.12",
    "rich>=13.0",
    "httpx>=0.27",
    "pydantic>=2.0",
]

[project.scripts]
ot = "opentraces.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["opentraces"]

[tool.uv]
# dev: uv venv && uv pip install -e .
